<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#263a34">
    <meta
      name="description"
      content="Discover dining, wellness, activities, and guest information at The Seminyak Beach Resort & Spa."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Seminyak Beach Resort & Spa">
    <meta
      property="og:description"
      content="Your guide to dining, wellness, activities, and resort information."
    >
    <meta
      property="og:image"
      content="images/e98945f9-5d6e-4651-9211-f8a3d608f30f_Untitled-design.png"
    >
    <title>The Seminyak Beach Resort & Spa</title>
    <link
      rel="icon"
      href="images/e98945f9-5d6e-4651-9211-f8a3d608f30f_Untitled-design.png"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="styles/site.css">
    <script src="scripts/app.js" defer></script>
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true">
      <span class="background-image" id="background-image"></span>
      <span class="background-overlay" id="background-overlay"></span>
      <span class="glow glow-one"></span>
      <span class="glow glow-two"></span>
    </div>

    <main class="page-shell">
      <header class="profile" id="profile" aria-labelledby="profile-name">
        <div class="avatar-wrap" id="avatar-wrap" hidden>
          <img class="avatar" id="avatar" src="" alt="">
        </div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="profile-name">The Seminyak Beach Resort &amp; Spa</h1>
        <p class="profile-description" id="profile-description">
          5-star beachfront resort in Seminyak
        </p>
        <nav class="social-links" id="social-links" aria-label="Social media and contact"></nav>
      </header>

      <div class="content-status" id="content-status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        Loading resort information…
      </div>

      <div class="sections" id="sections" aria-live="polite"></div>

      <noscript>
        <div class="content-error">
          Please enable JavaScript to view the resort links.
        </div>
      </noscript>
    </main>
  </body>
</html>
